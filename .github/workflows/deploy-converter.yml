name: Deploy Excel to XML app

on:
  push:
    branches: [ccr-7c310ec5-u81mdd]
    paths: ['excel_to_xml/web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: excel_to_xml/web
      - id: deployment
        uses: actions/deploy-pages@v4
